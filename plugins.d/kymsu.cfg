#Timestamp de la dernière installation
last.update=1793707853

# Homebrew
# Ces casks ne seront pas misà-jour
pinned_cask=ff-works

# Node
# Ces modules seront pas mis à jour
#pinned_npm=@squoosh/cli thumbsup
pinned_npm=@squoosh/cli thumbsup
npm_local_path=$HOME/Sites
npm_update_node=true
npm_doctor=true
npm_display_info=true

# PECL
# Affiche un PHP info dans le browser par défaut.
pecl_php_info=false

# pipx
pipx_injected=true

# Perl
#Mode dry-run: signale les mises-à-jour mais ne les fait pas.
perl_dry_run=false

# GEM
# Ne génère pas la documentation (+ rapide).
gem_no_document=true
# Mode dry-run: signale les mises-à-jour mais ne les fait pas.
gem_dry_run=false
